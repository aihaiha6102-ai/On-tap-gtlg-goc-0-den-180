<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hiểu Bài Sâu - Nhớ Bài Mau | Ôn tập Toán</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    
    <!-- Cấu hình MathJax trước khi tải thư viện -->
    <script>
        window.MathJax = {
            tex: {
                inlineMath: [['\\(', '\\)']]
            },
            startup: {
                typeset: false // Tắt tự động render ban đầu để control thủ công qua JS
            }
        };
    </script>
    <!-- MathJax Library -->
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>

    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0f172a; /* Nền dark mode (Tailwind slate-900) */
            background-image: 
                radial-gradient(circle at 15% 50%, rgba(236, 72, 153, 0.05), transparent 25%),
                radial-gradient(circle at 85% 30%, rgba(6, 182, 212, 0.05), transparent 25%);
            color: #f8fafc;
            min-height: 100vh;
        }

        h1, h2, h3, .font-title {
            font-family: 'Montserrat', sans-serif;
        }

        /* Hiệu ứng Text Neon */
        .neon-text-title {
            color: #fff;
            text-shadow: 
                0 0 5px #fff,
                0 0 10px #fff,
                0 0 20px #e81cff,
                0 0 40px #e81cff,
                0 0 80px #e81cff;
        }
        
        .neon-text-cyan {
            text-shadow: 0 0 5px rgba(6, 182, 212, 0.8), 0 0 10px rgba(6, 182, 212, 0.5);
        }

        /* Nút và Box Neon */
        .neon-box {
            background: rgba(30, 41, 59, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(10px);
        }

        .neon-input {
            background: rgba(15, 23, 42, 0.8);
            border: 2px solid #334155;
            transition: all 0.3s ease;
        }
        .neon-input:focus {
            outline: none;
            border-color: #06b6d4;
            box-shadow: 0 0 15px rgba(6, 182, 212, 0.5);
        }

        .btn-primary {
            background: linear-gradient(45deg, #06b6d4, #3b82f6);
            transition: all 0.3s ease;
            box-shadow: 0 0 10px rgba(6, 182, 212, 0.3);
        }
        .btn-primary:hover {
            box-shadow: 0 0 20px rgba(6, 182, 212, 0.7), 0 0 30px rgba(59, 130, 246, 0.5);
            transform: translateY(-2px);
        }

        /* Option Buttons */
        .option-btn {
            background: rgba(30, 41, 59, 0.8);
            border: 2px solid #475569;
            transition: all 0.2s ease;
        }
        .option-btn:hover {
            border-color: #a855f7;
            background: rgba(168, 85, 247, 0.1);
        }
        .option-btn.selected {
            border-color: #e81cff;
            background: rgba(232, 28, 255, 0.15);
            box-shadow: 0 0 15px rgba(232, 28, 255, 0.5);
        }

        /* Animations */
        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }
        .animate-fade-in {
            animation: fadeIn 0.4s ease-out forwards;
        }
        
        .hidden-screen {
            display: none !important;
        }

        /* Custom Scrollbar cho phần xem lại bài */
        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: rgba(30, 41, 59, 0.5);
            border-radius: 10px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: rgba(6, 182, 212, 0.5);
            border-radius: 10px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: rgba(6, 182, 212, 0.8);
        }
    </style>
</head>
<body class="flex items-center justify-center p-4 sm:p-8">

    <!-- MÀN HÌNH 1: ĐĂNG NHẬP -->
    <div id="screen-login" class="w-full max-w-lg neon-box rounded-2xl p-8 sm:p-12 animate-fade-in text-center">
        <h1 class="text-4xl sm:text-5xl font-extrabold mb-8 neon-text-title tracking-tight leading-tight">HIỂU BÀI SÂU<br/>NHỚ BÀI MAU</h1>
        
        <div class="space-y-5 text-left mb-8">
            <div>
                <label class="block text-sm font-medium text-gray-300 mb-2">Họ và tên học sinh</label>
                <input type="text" id="input-name" class="w-full neon-input text-white rounded-xl px-4 py-3" placeholder="Ví dụ: Trần Văn A" autocomplete="off">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-300 mb-2">Lớp</label>
                <input type="text" id="input-class" class="w-full neon-input text-white rounded-xl px-4 py-3" placeholder="Ví dụ: 10A1" autocomplete="off">
            </div>
            <p id="login-error" class="text-rose-500 text-sm hidden font-medium text-center">Vui lòng điền đầy đủ thông tin để bắt đầu!</p>
        </div>

        <button onclick="startQuiz()" class="btn-primary w-full text-white font-bold text-lg rounded-xl px-6 py-4">
            VÀO THI NGAY
        </button>
    </div>

    <!-- MÀN HÌNH 2: LÀM BÀI TRẮC NGHIỆM -->
    <div id="screen-quiz" class="w-full max-w-3xl neon-box rounded-2xl p-6 sm:p-10 hidden-screen flex-col">
        <!-- Header -->
        <div class="flex justify-between items-center mb-6 border-b border-slate-700 pb-4">
            <div class="font-title text-xl font-bold neon-text-cyan">Ôn Tập Lượng Giác</div>
            <div class="bg-slate-800 px-4 py-2 rounded-lg font-bold text-cyan-400 shadow-inner">
                Câu <span id="current-q-num">1</span>/5
            </div>
        </div>

        <!-- Question -->
        <div class="mb-8">
            <h2 id="question-text" class="text-lg sm:text-xl font-medium leading-relaxed text-slate-100">
                <!-- Nội dung câu hỏi sẽ được render tại đây -->
            </h2>
        </div>

        <!-- Options -->
        <div id="options-container" class="grid grid-cols-1 gap-4 mb-10">
            <!-- Các nút đáp án sẽ được sinh ra từ JS -->
        </div>

        <!-- Navigation -->
        <div class="flex justify-between items-center mt-auto">
            <button id="btn-prev" onclick="prevQuestion()" class="px-6 py-3 rounded-xl font-semibold bg-slate-700 text-white hover:bg-slate-600 transition-colors hidden">
                ← Câu trước
            </button>
            <button id="btn-next" onclick="nextQuestion()" class="btn-primary px-8 py-3 rounded-xl font-bold text-white ml-auto">
                Câu tiếp theo →
            </button>
        </div>
    </div>

    <!-- MÀN HÌNH 3: KẾT QUẢ -->
    <div id="screen-result" class="w-full max-w-3xl neon-box rounded-2xl p-6 sm:p-10 hidden-screen text-center flex-col items-center">
        <h2 class="text-3xl font-bold mb-4 font-title text-cyan-400">HOÀN THÀNH BÀI TẬP</h2>
        
        <div class="relative w-40 h-40 flex items-center justify-center rounded-full border-4 border-fuchsia-500 my-8 shadow-[0_0_30px_rgba(217,70,239,0.5)] mx-auto">
            <div class="text-6xl font-extrabold text-white drop-shadow-[0_0_10px_rgba(255,255,255,0.8)]">
                <span id="final-score">0</span>
            </div>
            <div class="absolute -bottom-4 bg-fuchsia-600 text-white px-4 py-1 rounded-full font-bold text-sm">
                ĐIỂM
            </div>
        </div>

        <h3 id="result-message" class="text-xl sm:text-2xl font-semibold mb-2 text-white"></h3>
        <p class="text-slate-400 mb-8 text-sm">Kết quả của bạn đã được lưu lại hệ thống.</p>
        
        <!-- Chi tiết bài làm -->
        <div id="review-container" class="w-full text-left space-y-4 max-h-[50vh] overflow-y-auto pr-2 custom-scrollbar mb-8 hidden">
            <!-- Nội dung review sẽ được sinh ra từ JS -->
        </div>

        <!-- Loading State during submission -->
        <div id="submit-status" class="text-emerald-400 font-medium bg-emerald-400/10 px-4 py-2 rounded-lg inline-block hidden">
            Đang gửi dữ liệu về hệ thống...
        </div>
    </div>

    <script>
        // DỮ LIỆU CÂU HỎI GỐC (Bao gồm mapping với Google Form ID)
        // Câu 1 sửa đáp án \cos \alpha = x_0 thành y_0
        const originalQuestions = [
            {
                id: 1,
                formEntryId: "entry.395463297",
                question: "Trong mặt phẳng tọa độ Oxy, cho nửa đường tròn đơn vị tâm O nằm phía trên trục hoành. Với mỗi góc \\( \\alpha (0^{\\circ} \\le \\alpha \\le 180^{\\circ}) \\), ta xác định một điểm \\( M(x_{0};y_{0}) \\) trên nửa đường tròn đó sao cho \\( \\widehat{xOM} = \\alpha \\). Theo định nghĩa, khẳng định nào sau đây là đúng?",
                options: [
                    "\\( \\sin \\alpha = x_{0} \\)",
                    "\\( \\sin \\alpha = y_{0} \\)",
                    "\\( \\cos \\alpha = y_{0} \\)", // Đã sửa thành y_0
                    "\\( \\tan \\alpha = \\frac{y_{0}}{x_{0}} \\) với mọi \\( 0^{\\circ} \\le \\alpha \\le 180^{\\circ} \\)"
                ],
                correctOptionIndex: 1 // Vị trí đáp án đúng trong mảng gốc (chữ B)
            },
            {
                id: 2,
                formEntryId: "entry.97662846",
                question: "Cho góc nhọn \\( \\alpha (0^{\\circ} \\le \\alpha \\le 180^{\\circ}) \\). Khi góc \\( \\alpha \\) tăng dần từ \\( 0^{\\circ} \\) đến \\( 90^{\\circ} \\), khẳng định nào sau đây về dấu hoặc sự thay đổi của các giá trị lượng giác là đúng?",
                options: [
                    "\\( \\cos \\alpha > 0 \\) và giá trị \\( \\cos \\alpha \\) giảm dần",
                    "\\( \\cos \\alpha < 0 \\) và giá trị \\( \\cos \\alpha \\) tăng dần",
                    "\\( \\sin \\alpha > 0 \\) và giá trị \\( \\sin \\alpha \\) giảm dần",
                    "\\( \\tan \\alpha < 0 \\) và giá trị \\( \\tan \\alpha \\) tăng dần"
                ],
                correctOptionIndex: 0 // Chữ A
            },
            {
                id: 3,
                formEntryId: "entry.1938547069",
                question: "Mối quan hệ giữa các giá trị lượng giác của hai góc bù nhau (\\( \\alpha \\) và \\( 180^{\\circ} - \\alpha \\)) là một kiến thức cốt lõi của bài học. Khẳng định nào sau đây là sai?",
                options: [
                    "\\( \\sin(180^{\\circ} - \\alpha) = \\sin \\alpha \\)",
                    "\\( \\cos(180^{\\circ} - \\alpha) = -\\cos \\alpha \\)",
                    "\\( \\tan(180^{\\circ} - \\alpha) = -\\tan \\alpha \\) (\\( \\alpha \\ne 90^{\\circ} \\))",
                    "\\( \\cot(180^{\\circ} - \\alpha) = \\cot \\alpha \\) (\\( 0^{\\circ} < \\alpha < 180^{\\circ}, \\alpha \\ne 90^{\\circ} \\))"
                ],
                correctOptionIndex: 3 // Chữ D
            },
            {
                id: 4,
                formEntryId: "entry.998885693",
                question: "Tính giá trị của biểu thức biểu diễn mối quan hệ giữa các góc đặc biệt sau đây: \\( P = \\sin 30^{\\circ} \\cdot \\cos 60^{\\circ} + \\sin 150^{\\circ} \\cdot \\cos 120^{\\circ} \\)",
                options: [
                    "\\( P = 0 \\)",
                    "\\( P = \\frac{1}{2} \\)",
                    "\\( P = 1 \\)",
                    "\\( P = -\\frac{1}{2} \\)"
                ],
                correctOptionIndex: 0 // Chữ A
            },
            {
                id: 5,
                formEntryId: "entry.1100089175",
                question: "Cho góc \\( \\alpha \\) thỏa mãn \\( 0^{\\circ} \\le \\alpha \\le 180^{\\circ} \\) và \\( \\alpha \\ne 90^{\\circ} \\). Biết rằng \\( \\tan \\alpha = -2 \\). Hãy tính giá trị của biểu thức: \\( A = \\frac{3\\sin \\alpha - 4\\cos \\alpha}{2\\sin \\alpha + 5\\cos \\alpha} \\)",
                options: [
                    "\\( A = -2 \\)",
                    "\\( A = \\frac{2}{9} \\)",
                    "\\( A = -10 \\)",
                    "\\( A = 10 \\)"
                ],
                correctOptionIndex: 2 // Chữ C
            }
        ];

        // Biến trạng thái ứng dụng (State)
        let studentName = "";
        let studentClass = "";
        let startTime = "";
        let endTime = "";
        let currentQuestionIndex = 0;
        let score = 0;
        
        let activeQuestions = []; // Lưu danh sách câu hỏi và đáp án đã xáo trộn
        let userAnswers = []; // Lưu object: { text, screenLetter, originalLetter }

        const LETTERS = ["A", "B", "C", "D"];

        // Hàm xáo trộn mảng ngẫu nhiên (Fisher-Yates)
        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
        }

        // Khởi tạo bài thi với sự xáo trộn
        function prepareQuiz() {
            // Deep copy mảng gốc để không làm hỏng dữ liệu ban đầu
            activeQuestions = JSON.parse(JSON.stringify(originalQuestions));
            
            // 1. Xáo trộn thứ tự các câu hỏi
            shuffleArray(activeQuestions);
            
            // 2. Xáo trộn các đáp án trong từng câu hỏi
            activeQuestions.forEach(q => {
                // Ánh xạ đáp án gốc với chữ cái (A, B, C, D) để lúc submit form trả đúng về chữ cái gốc
                q.originalOptionMap = {
                    [q.options[0]]: "A",
                    [q.options[1]]: "B",
                    [q.options[2]]: "C",
                    [q.options[3]]: "D"
                };
                
                // Lưu lại nội dung của đáp án đúng trước khi xáo trộn
                q.correctOptionText = q.options[q.correctOptionIndex];
                
                // Xáo trộn vị trí 4 đáp án
                shuffleArray(q.options);
            });

            userAnswers = new Array(activeQuestions.length).fill(null);
            currentQuestionIndex = 0;
        }

        // Lấy thời gian định dạng HH:MM
        function getCurrentTimeFormatted() {
            const now = new Date();
            const h = String(now.getHours()).padStart(2, '0');
            const m = String(now.getMinutes()).padStart(2, '0');
            return `${h}:${m}`;
        }

        function switchScreen(hideId, showId) {
            document.getElementById(hideId).classList.add('hidden-screen');
            document.getElementById(hideId).classList.remove('animate-fade-in');
            
            const showEl = document.getElementById(showId);
            showEl.classList.remove('hidden-screen');
            showEl.classList.add('flex', 'animate-fade-in');
        }

        function startQuiz() {
            const nameInput = document.getElementById('input-name').value.trim();
            const classInput = document.getElementById('input-class').value.trim();
            const errorText = document.getElementById('login-error');

            if (!nameInput || !classInput) {
                errorText.classList.remove('hidden');
                return;
            }

            studentName = nameInput;
            studentClass = classInput;
            startTime = getCurrentTimeFormatted();
            errorText.classList.add('hidden');

            // Xáo trộn và chuẩn bị dữ liệu
            prepareQuiz();

            switchScreen('screen-login', 'screen-quiz');
            renderQuestion();
        }

        function renderQuestion() {
            const q = activeQuestions[currentQuestionIndex];
            
            // Cập nhật số thứ tự câu
            document.getElementById('current-q-num').innerText = (currentQuestionIndex + 1);
            
            // Cập nhật nội dung câu hỏi
            document.getElementById('question-text').innerHTML = q.question;
            
            // Tạo nút đáp án
            const optionsContainer = document.getElementById('options-container');
            optionsContainer.innerHTML = '';
            
            q.options.forEach((optText, index) => {
                const screenLetter = LETTERS[index]; // Chữ cái hiển thị trên màn hình hiện tại (A, B, C, D)
                const btn = document.createElement('button');
                btn.className = `option-btn w-full text-left p-4 rounded-xl text-slate-200 cursor-pointer flex items-start gap-3`;
                btn.onclick = () => selectAnswer(index);
                
                // Tô sáng nếu đã chọn
                if (userAnswers[currentQuestionIndex] && userAnswers[currentQuestionIndex].text === optText) {
                    btn.classList.add('selected');
                }

                // Cấu trúc nội dung đáp án (chữ cái + nội dung gốc)
                btn.innerHTML = `
                    <span class="font-bold text-fuchsia-400 mt-0.5 min-w-[1.5rem]">${screenLetter}.</span>
                    <span class="flex-1">${optText}</span>
                `;
                optionsContainer.appendChild(btn);
            });

            // Xử lý nút điều hướng
            const btnPrev = document.getElementById('btn-prev');
            const btnNext = document.getElementById('btn-next');

            if (currentQuestionIndex === 0) {
                btnPrev.classList.add('hidden');
            } else {
                btnPrev.classList.remove('hidden');
            }

            if (currentQuestionIndex === activeQuestions.length - 1) {
                btnNext.innerText = "NỘP BÀI ✓";
                btnNext.classList.replace('btn-primary', 'bg-gradient-to-r');
                btnNext.classList.add('from-emerald-400', 'to-teal-500', 'shadow-[0_0_15px_rgba(52,211,153,0.5)]');
            } else {
                btnNext.innerText = "Câu tiếp theo →";
                btnNext.classList.replace('bg-gradient-to-r', 'btn-primary');
                btnNext.classList.remove('from-emerald-400', 'to-teal-500', 'shadow-[0_0_15px_rgba(52,211,153,0.5)]');
            }

            // Render lại MathJax
            if (window.MathJax && window.MathJax.typesetPromise) {
                window.MathJax.typesetPromise([document.getElementById('screen-quiz')]).catch((err) => console.log(err.message));
            }
        }

        function selectAnswer(optionIndex) {
            const q = activeQuestions[currentQuestionIndex];
            const selectedText = q.options[optionIndex];
            const screenLetter = LETTERS[optionIndex];
            const originalLetter = q.originalOptionMap[selectedText]; // Quy đổi ra chữ cái nguyên bản để nộp Google Forms
            
            userAnswers[currentQuestionIndex] = {
                text: selectedText,
                screenLetter: screenLetter,
                originalLetter: originalLetter
            };
            
            // Cập nhật UI nút
            const buttons = document.getElementById('options-container').children;
            for (let i = 0; i < buttons.length; i++) {
                buttons[i].classList.remove('selected');
                if (i === optionIndex) {
                    buttons[i].classList.add('selected');
                }
            }
        }

        function prevQuestion() {
            if (currentQuestionIndex > 0) {
                currentQuestionIndex--;
                renderQuestion();
            }
        }

        function nextQuestion() {
            if (currentQuestionIndex < activeQuestions.length - 1) {
                currentQuestionIndex++;
                renderQuestion();
            } else {
                submitQuiz();
            }
        }

        function submitQuiz() {
            endTime = getCurrentTimeFormatted();
            
            // Tính điểm
            score = 0;
            for (let i = 0; i < activeQuestions.length; i++) {
                const ans = userAnswers[i];
                if (ans && ans.text === activeQuestions[i].correctOptionText) {
                    score += 2;
                }
            }

            // Chuyển sang màn hình kết quả
            switchScreen('screen-quiz', 'screen-result');
            
            // Render điểm
            animateValue("final-score", 0, score, 1000);

            // Đưa ra lời động viên
            const msgEl = document.getElementById('result-message');
            if (score >= 9) {
                msgEl.innerText = "Xuất sắc! Bạn là bậc thầy Toán học!";
                msgEl.className = "text-xl sm:text-2xl font-semibold mb-2 text-fuchsia-400 neon-text-pink";
            } else if (score >= 7) {
                msgEl.innerText = "Rất tốt! Nền tảng của bạn rất vững chắc!";
                msgEl.className = "text-xl sm:text-2xl font-semibold mb-2 text-cyan-400 neon-text-cyan";
            } else if (score >= 5) {
                msgEl.innerText = "Hoàn thành nhiệm vụ! Hãy ôn tập thêm một chút nữa nhé!";
                msgEl.className = "text-xl sm:text-2xl font-semibold mb-2 text-yellow-400";
            } else {
                msgEl.innerText = "Đừng buồn, thất bại là mẹ thành công. Hãy xem lại bài giảng nhé!";
                msgEl.className = "text-xl sm:text-2xl font-semibold mb-2 text-rose-400";
            }

            // Hiển thị chi tiết bài làm
            const reviewContainer = document.getElementById('review-container');
            reviewContainer.classList.remove('hidden');
            let reviewHTML = '<h3 class="text-lg font-bold text-cyan-300 mb-4 border-b border-slate-700 pb-2 sticky top-0 bg-[#1e293b]/90 backdrop-blur-md z-10 pt-2">Chi tiết bài làm:</h3>';
            
            activeQuestions.forEach((q, index) => {
                const ans = userAnswers[index];
                const isCorrect = ans && (ans.text === q.correctOptionText);
                const statusText = isCorrect ? '<span class="text-emerald-400 font-bold">Đúng ✓</span>' : '<span class="text-rose-400 font-bold">Sai ✗</span>';
                const bgColor = isCorrect ? 'bg-emerald-900/10 border-emerald-500/30' : 'bg-rose-900/10 border-rose-500/30';
                
                const userOptText = ans ? `${ans.screenLetter}. ${ans.text}` : "Chưa chọn";
                
                // Tìm vị trí hiển thị của đáp án đúng trên màn hình vừa rồi
                const correctScreenIndex = q.options.indexOf(q.correctOptionText);
                const correctScreenLetter = correctScreenIndex !== -1 ? LETTERS[correctScreenIndex] : "";

                reviewHTML += `
                    <div class="p-4 rounded-xl border ${bgColor} mb-3 backdrop-blur-sm relative">
                        <div class="font-bold text-slate-300 mb-2 text-base flex justify-between">
                            <span>Câu ${index + 1}</span>
                            <span>${statusText}</span>
                        </div>
                        <div class="text-sm text-slate-200 mb-3 leading-relaxed">${q.question}</div>
                        <div class="text-sm space-y-2 p-3 rounded-lg bg-slate-900/50">
                            <div class="${isCorrect ? 'text-emerald-300' : 'text-rose-300'}">
                                <span class="font-bold">Bạn chọn:</span> ${userOptText}
                            </div>
                            ${!isCorrect ? `
                            <div class="text-emerald-400 mt-2 border-t border-slate-700/50 pt-2">
                                <span class="font-bold">Đáp án đúng:</span> ${correctScreenLetter}. ${q.correctOptionText}
                            </div>
                            ` : ''}
                        </div>
                    </div>
                `;
            });
            
            reviewContainer.innerHTML = reviewHTML;
            
            // Yêu cầu MathJax render lại phần review
            if (window.MathJax && window.MathJax.typesetPromise) {
                window.MathJax.typesetPromise([reviewContainer]).catch((err) => console.log(err.message));
            }

            // Gửi dữ liệu form ngầm
            submitToGoogleForm();
        }

        // Hiệu ứng số chạy
        function animateValue(id, start, end, duration) {
            if (start === end) {
                document.getElementById(id).innerHTML = end;
                return;
            }
            let startTimestamp = null;
            const step = (timestamp) => {
                if (!startTimestamp) startTimestamp = timestamp;
                const progress = Math.min((timestamp - startTimestamp) / duration, 1);
                document.getElementById(id).innerHTML = Math.floor(progress * (end - start) + start);
                if (progress < 1) {
                    window.requestAnimationFrame(step);
                } else {
                    document.getElementById(id).innerHTML = end;
                }
            };
            window.requestAnimationFrame(step);
        }

        // Gửi dữ liệu bằng Google Forms URL Provided
        function submitToGoogleForm() {
            const statusEl = document.getElementById('submit-status');
            statusEl.classList.remove('hidden');

            const formUrl = "https://docs.google.com/forms/d/e/1FAIpQLSe2q_X6PZBRgnEX8WqLyYrE5s7PIExzml9g_WtoE6EMGDFQ2w/formResponse";
            const formData = new URLSearchParams();
            
            // Ánh xạ form entry ID
            formData.append("entry.494308683", studentName);
            formData.append("entry.275633530", studentClass);
            formData.append("entry.79216306", startTime);
            formData.append("entry.1293936189", endTime);
            formData.append("entry.220862082", score);
            
            // Gửi dữ liệu đáp án: Mapping lại ID câu hỏi về ký tự GỐC mà học sinh đã chọn
            activeQuestions.forEach((q, index) => {
                const ans = userAnswers[index];
                // Lấy chữ cái nguyên bản tương ứng với đáp án text đã chọn
                const originalLetter = ans ? ans.originalLetter : "";
                formData.append(q.formEntryId, originalLetter);
            });

            fetch(formUrl, {
                method: "POST",
                mode: "no-cors",
                headers: {
                    "Content-Type": "application/x-www-form-urlencoded"
                },
                body: formData.toString()
            })
            .then(() => {
                statusEl.innerText = "✓ Dữ liệu đã được lưu vào hệ thống!";
                statusEl.classList.replace('text-emerald-400', 'text-cyan-400');
                statusEl.classList.replace('bg-emerald-400/10', 'bg-cyan-400/10');
            })
            .catch((error) => {
                console.error("Lỗi khi gửi form:", error);
                statusEl.innerText = "Lỗi kết nối. Nhưng kết quả của bạn đã hiện trên màn hình.";
                statusEl.classList.replace('text-emerald-400', 'text-rose-400');
                statusEl.classList.replace('bg-emerald-400/10', 'bg-rose-400/10');
            });
        }
    </script>
</body>
</html>
